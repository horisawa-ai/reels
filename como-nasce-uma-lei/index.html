<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Como Nasce Uma Lei</title>
<style>
  :root { --bg: #04070f; --fg: #e8ecf5; --muted: #8a93a8; --accent: #FFDF00; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; padding: 12px 16px; box-sizing: border-box; }
  canvas { height: calc(100vh - 90px); max-width: 100%; aspect-ratio: 9 / 16; object-fit: contain; border-radius: 14px; background: #000; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100%, 520px); }
  button { background: var(--accent); color: #111; border: 0; border-radius: 999px; font-weight: 800; padding: 8px 18px; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 88px; text-align: right; }
  body.render .bar { display: none; }
  body.render .wrap { padding: 0; }
  body.render canvas { height: auto; width: 1080px; border-radius: 0; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="stage"></canvas>
  <div class="bar">
    <button id="play">Pausar</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span class="time" id="time">0.0s</span>
  </div>
</div>
<script src="assets/flag-brazil.js"></script>
<script src="motion.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const M = window.MOTION;
  if (params.has('render')) document.body.classList.add('render');
  M.ready.then(() => {
    window.MOTION_READY = true;
    if (params.has('render')) return;
    let t = parseFloat(params.get('t') || '0'), playing = !params.has('t'), last = performance.now();
    const btn = document.getElementById('play'), seek = document.getElementById('seek'), time = document.getElementById('time');
    btn.textContent = playing ? 'Pausar' : 'Play';
    btn.onclick = () => { playing = !playing; if (playing && t >= M.DURATION) t = 0; btn.textContent = playing ? 'Pausar' : 'Play'; };
    seek.oninput = () => { t = seek.value / 1000 * M.DURATION; };
    document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.click(); } });
    function loop(now) {
      if (playing) { t += (now - last) / 1000; if (t > M.DURATION) { t = M.DURATION; playing = false; btn.textContent = 'Play'; } }
      last = now;
      M.render(t);
      seek.value = Math.round(t / M.DURATION * 1000);
      time.textContent = t.toFixed(1) + 's / ' + M.DURATION.toFixed(1) + 's';
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  });
</script>
</body>
</html>
